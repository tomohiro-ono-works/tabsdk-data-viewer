<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tabsdk-data-viewer</title>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <div class="title">Data Viewer</div>
      <div class="spacer"></div>
      <button id="openSettings" class="button">設定</button>
      <button id="refreshData" class="button">再読み込み</button>
    </header>

    <main class="main">
      <div id="message" class="message">読み込み中...</div>

      <div class="table-wrap">
        <table id="dataTable">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </main>

    <section id="settingsPanel" class="settings-panel" hidden>
      <div class="settings-card">
        <div class="settings-header">
          <strong>列設定</strong>
          <button id="closeSettings" class="button">閉じる</button>
        </div>
        <div class="settings-body">
          <label class="settings-field">
            <span>左から固定する列数</span>
            <input id="fixedColumnCount" class="settings-number" type="number" min="0" step="1" value="0">
          </label>
          <div class="settings-help">0で固定なし。列順はドラッグして変更します。数値列は表示方式も選択できます。</div>
          <div id="columnOrderList" class="column-order-list"></div>
        </div>
        <div class="settings-footer">
          <button id="resetColumnOrder" class="button">Tableau順に戻す</button>
          <div class="spacer"></div>
          <button id="cancelSettings" class="button">キャンセル</button>
          <button id="applySettings" class="button">適用</button>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div id="status">-</div>

      <div class="pager">
        <button id="prev" class="button">前へ</button>
        <span id="page">-</span>
        <button id="next" class="button">次へ</button>
      </div>
    </footer>
  </div>

  <script src="https://extensions.tableauusercontent.com/resources/tableau.extensions.1.latest.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
